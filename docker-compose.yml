services:
  claude-thinking-proxy:
    build: .
    image: claude-thinking-proxy:latest
    container_name: claude-thinking-proxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8848}:8848"
    environment:
      PORT: 8848
      NODE_ENV: production
      DEFAULT_UPSTREAM_URL: ${DEFAULT_UPSTREAM_URL:-https://api.anthropic.com}
      DEFAULT_API_KEY: ${DEFAULT_API_KEY:-}
      UPSTREAMS_JSON: ${UPSTREAMS_JSON:-}
      UPSTREAM_URLS: ${UPSTREAM_URLS:-}
      UPSTREAM_API_KEYS: ${UPSTREAM_API_KEYS:-}
      UPSTREAM_TYPES: ${UPSTREAM_TYPES:-}
      UPSTREAM_MODELS: ${UPSTREAM_MODELS:-}
      DEFAULT_THINKING_ENABLED: ${DEFAULT_THINKING_ENABLED:-true}
      DEFAULT_THINKING_BUDGET: ${DEFAULT_THINKING_BUDGET:-5000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8848/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
